<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopLite</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1d2330}
  header{background:#1d2330;color:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
  header a{color:#fff;text-decoration:none;margin-left:16px}
  main{max-width:900px;margin:24px auto;padding:0 16px}
  .card{background:#fff;border:1px solid #e2e5ea;border-radius:8px;padding:16px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .error{color:#b3261e;font-size:14px}
  button{background:#2f6fed;color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
  button:disabled{background:#9aa3b2;cursor:not-allowed}
  input,select{padding:8px;border:1px solid #c9ced6;border-radius:6px;width:100%;box-sizing:border-box;margin:4px 0 10px}
  .badge{background:#e5484d;border-radius:10px;padding:1px 8px;font-size:12px}
  table{width:100%;border-collapse:collapse} td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}
</style>
</head>
<body>
<header>
  <strong>ShopLite</strong>
  {% if session.get('user') %}
  <nav>
    <a href="/products" data-test="nav-products">Products</a>
    <a href="/cart" data-test="nav-cart">Cart <span class="badge" data-test="cart-badge">{{ badge }}</span></a>
    <a href="/logout" data-test="nav-logout">Logout</a>
  </nav>
  {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
