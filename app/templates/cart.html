{% extends "base.html" %}{% block content %}
<h2>Your cart</h2>
{% if lines %}
<div class="card"><table data-test="cart-table">
  <tr><th>Item</th><th>Qty</th><th>Price</th><th></th></tr>
  {% for l in lines %}
  <tr data-test="cart-row">
    <td data-test="cart-item-name">{{ l.name }}</td><td data-test="cart-item-qty">{{ l.qty }}</td>
    <td>₹{{ '%.2f'|format(l.line_total) }}</td>
    <td><form method="post" action="/cart/remove/{{ l.id }}"><button data-test="remove-{{ l.id }}">Remove</button></form></td>
  </tr>
  {% endfor %}
</table>
<p><strong>Total: ₹<span data-test="cart-total">{{ '%.2f'|format(total) }}</span></strong></p>
<a href="/checkout"><button data-test="checkout-button">Checkout</button></a>
</div>
{% else %}
<p data-test="empty-cart">Your cart is empty.</p>
{% endif %}
{% endblock %}
