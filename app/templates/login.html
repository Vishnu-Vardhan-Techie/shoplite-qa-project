{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:360px;margin:40px auto">
  <h2>Sign in</h2>
  <form method="post" data-test="login-form">
    <label for="username">Username</label>
    <input id="username" name="username" data-test="username" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" data-test="password" autocomplete="current-password">
    {% if error %}<p class="error" data-test="login-error" role="alert">{{ error }}</p>{% endif %}
    <button type="submit" data-test="login-button">Login</button>
  </form>
</div>
{% endblock %}
