[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    smoke: critical-path checks run on every build
    regression: full regression suite
    api: REST API tests
    ui: browser (Playwright) tests
    e2e: end-to-end user journeys
    known_bug: test that reproduces a logged defect (expected to fail until fixed)
xfail_strict = true
